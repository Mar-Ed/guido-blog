<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Room / Studio Floor & Wall -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Architectural wall grid pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Parquet / Showroom Floor -->
  <polygon points="0,420 800,420 800,600 0,600" fill="#181e29"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#334155" stroke-width="2"/>
  
  <!-- Ambient light glow -->
  <ellipse cx="400" cy="380" rx="320" ry="120" fill="url(#glowGrad)"/>

  <!-- Modern Luxury Sofa -->
  <!-- Sofa Back -->
  <rect x="220" y="270" width="360" height="110" rx="20" fill="url(#sofaGrad)"/>
  <!-- Sofa Cushions -->
  <rect x="235" y="320" width="160" height="65" rx="14" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <rect x="405" y="320" width="160" height="65" rx="14" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <!-- Pillows -->
  <rect x="245" y="300" width="60" height="50" rx="10" fill="#fbbf24" opacity="0.9" transform="rotate(-8 245 300)"/>
  <rect x="495" y="300" width="60" height="50" rx="10" fill="#38bdf8" opacity="0.9" transform="rotate(10 495 300)"/>
  <!-- Armrests -->
  <rect x="195" y="300" width="40" height="85" rx="12" fill="#1e40af"/>
  <rect x="565" y="300" width="40" height="85" rx="12" fill="#1e40af"/>
  <!-- Sofa Wooden Legs -->
  <polygon points="215,385 225,385 220,430 210,430" fill="url(#woodGrad)"/>
  <polygon points="575,385 585,385 590,430 580,430" fill="url(#woodGrad)"/>
  <polygon points="395,385 405,385 405,430 395,430" fill="url(#woodGrad)"/>

  <!-- Designer Coffee Table (Wood & Metal) -->
  <ellipse cx="400" cy="450" rx="110" ry="24" fill="url(#woodGrad)" stroke="#78350f" stroke-width="2"/>
  <ellipse cx="400" cy="446" rx="106" ry="20" fill="#f59e0b" opacity="0.3"/>
  <line x1="330" y1="455" x2="320" y2="495" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="470" y1="455" x2="480" y2="495" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="458" x2="400" y2="498" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

  <!-- Minimalist Floor Lamp -->
  <line x1="680" y1="180" x2="680" y2="460" stroke="#cbd5e1" stroke-width="3"/>
  <ellipse cx="680" cy="460" rx="30" ry="8" fill="#475569"/>
  <!-- Lamp Shade -->
  <polygon points="650,220 710,220 695,160 665,160" fill="#f8fafc" opacity="0.9"/>
  <ellipse cx="680" cy="220" rx="30" ry="8" fill="#fef08a" opacity="0.6"/>

  <!-- Potted Plant on the Left -->
  <polygon points="120,460 140,460 135,420 125,420" fill="#cbd5e1"/>
  <!-- Leaves -->
  <path d="M130 420 Q100 370 120 340 Q135 380 130 420Z" fill="#10b981"/>
  <path d="M130 420 Q160 360 145 330 Q135 380 130 420Z" fill="#059669"/>
  <path d="M130 420 Q130 330 115 310 Q125 365 130 420Z" fill="#34d399"/>

  <!-- Tech / Database Hologram Elements Floating -->
  <g transform="translate(60, 80)">
    <rect width="180" height="70" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="25" cy="35" r="14" fill="#2563eb" fill-opacity="0.2"/>
    <path d="M21 31H29M21 35H29M21 39H26" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="30" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">SQL Database</text>
    <text x="48" y="46" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94a3b8">Control de Inventario</text>
    <circle cx="160" cy="22" r="4" fill="#10b981"/>
  </g>

  <g transform="translate(560, 60)">
    <rect width="180" height="70" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="25" cy="35" r="14" fill="#f59e0b" fill-opacity="0.2"/>
    <path d="M25 28L31 39H19L25 28Z" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="48" y="30" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Villa El Salvador</text>
    <text x="48" y="46" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94a3b8">Sede & Almacén Central</text>
    <circle cx="160" cy="22" r="4" fill="#3b82f6"/>
  </g>
</svg>
