<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="hallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#hallGrad)"/>
  
  <!-- Perspective Showroom Lines -->
  <line x1="0" y1="0" x2="150" y2="120" stroke="#475569" stroke-width="1.5"/>
  <line x1="400" y1="0" x2="250" y2="120" stroke="#475569" stroke-width="1.5"/>
  <line x1="0" y1="240" x2="150" y2="120" stroke="#475569" stroke-width="1.5"/>
  <line x1="400" y1="240" x2="250" y2="120" stroke="#475569" stroke-width="1.5"/>

  <!-- Back Wall -->
  <rect x="150" y="70" width="100" height="80" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="200" y="112" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#60a5fa" text-anchor="middle">SHOWROOM</text>
  <text x="200" y="125" font-family="'Inter', sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">VES - LIMA</text>

  <!-- Furniture silhouettes in showroom -->
  <!-- Dining table & chairs -->
  <rect x="50" y="145" width="80" height="15" rx="3" fill="#b45309"/>
  <line x1="60" y1="160" x2="55" y2="195" stroke="#78350f" stroke-width="3"/>
  <line x1="120" y1="160" x2="125" y2="195" stroke="#78350f" stroke-width="3"/>
  <!-- Chairs -->
  <rect x="35" y="135" width="15" height="25" rx="3" fill="#1e3a8a"/>
  <line x1="40" y1="160" x2="38" y2="190" stroke="#1e3a8a" stroke-width="2"/>
  <rect x="130" y="135" width="15" height="25" rx="3" fill="#1e3a8a"/>
  <line x1="140" y1="160" x2="142" y2="190" stroke="#1e3a8a" stroke-width="2"/>

  <!-- Shelving / Rack on right -->
  <rect x="290" y="100" width="80" height="90" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="290" y1="130" x2="370" y2="130" stroke="#64748b" stroke-width="2"/>
  <line x1="290" y1="160" x2="370" y2="160" stroke="#64748b" stroke-width="2"/>
  <!-- Products on shelves -->
  <rect x="300" y="112" width="25" height="18" rx="2" fill="#d97706"/>
  <rect x="335" y="115" width="25" height="15" rx="2" fill="#2563eb"/>
  <rect x="305" y="142" width="55" height="18" rx="2" fill="#0284c7"/>
</svg>
