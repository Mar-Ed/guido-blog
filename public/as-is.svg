<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%" style="background-color: #ffffff;">
  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444" />
    </marker>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <rect x="20" y="20" width="880" height="440" rx="12" fill="#fafafa" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="50" y="55" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#0f172a">FLUJO DE PROCESO ACTUAL: COMERCIALIZACIÓN Y GESTIÓN DE MUEBLES (AS-IS)</text>
  <text x="50" y="75" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#dc2626">Proceso Manual • Descentralizado • Alto Riesgo de Inconsistencias de Inventario y Demoras</text>

  <!-- Lane 1: CLIENTE -->
  <rect x="50" y="100" width="220" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="50" y="100" width="220" height="26" rx="8" fill="#f8fafc"/>
  <text x="65" y="118" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#475569">1. CLIENTE EN TIENDA</text>
  <text x="65" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#1e293b">Consulta por modelo de mueble,</text>
  <text x="65" y="162" font-family="'Inter', sans-serif" font-size="11" fill="#1e293b">precios y disponibilidad.</text>

  <!-- Arrow 1 to 2 -->
  <line x1="270" y1="145" x2="330" y2="145" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Lane 2: VENDEDOR -->
  <rect x="340" y="100" width="240" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="340" y="100" width="240" height="26" rx="8" fill="#fee2e2"/>
  <text x="355" y="118" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#991b1b">2. VENDEDOR (TIENDA)</text>
  <text x="355" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#1e293b">Anota requerimiento en cuaderno/papel.</text>
  <text x="355" y="162" font-family="'Inter', sans-serif" font-size="11" fill="#dc2626">Sin historial ni preferencias del cliente.</text>

  <!-- Arrow 2 to 3 -->
  <line x1="580" y1="145" x2="640" y2="145" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Lane 3: CONSULTA ALMACÉN -->
  <rect x="650" y="100" width="220" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="650" y="100" width="220" height="26" rx="8" fill="#fee2e2"/>
  <text x="665" y="118" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#991b1b">3. CONSULTA STOCK MANUAL</text>
  <text x="665" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#1e293b">Llamada o búsqueda en almacén.</text>
  <text x="665" y="162" font-family="'Inter', sans-serif" font-size="11" fill="#dc2626">Tiempo de espera prolongado.</text>

  <!-- Downward Arrow from 3 to 4 -->
  <path d="M760 190 L760 230 L760 260" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Lane 4: REVISIÓN DE KARDEX FÍSICO / ALMACÉN -->
  <rect x="650" y="270" width="220" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="650" y="270" width="220" height="26" rx="8" fill="#fef2f2"/>
  <text x="665" y="288" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#b91c1c">4. REGISTRO FÍSICO (PAPEL)</text>
  <text x="665" y="315" font-family="'Inter', sans-serif" font-size="11" fill="#1e293b">Kardex en papel no sincronizado.</text>
  <text x="665" y="332" font-family="'Inter', sans-serif" font-size="11" fill="#b91c1c">Riesgo: Stock fantasma o sobrestock.</text>

  <!-- Left Arrow from 4 to 5 -->
  <line x1="650" y1="315" x2="590" y2="315" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Lane 5: FACTURACIÓN MANUAL -->
  <rect x="340" y="270" width="240" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="340" y="270" width="240" height="26" rx="8" fill="#fee2e2"/>
  <text x="355" y="288" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#991b1b">5. FACTURACIÓN Y COBRO MANUAL</text>
  <text x="355" y="315" font-family="'Inter', sans-serif" font-size="11" fill="#1e293b">Llenado manual de boletas / recibos.</text>
  <text x="355" y="332" font-family="'Inter', sans-serif" font-size="11" fill="#dc2626">Cálculo manual propenso a errores.</text>

  <!-- Left Arrow from 5 to 6 -->
  <line x1="340" y1="315" x2="280" y2="315" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Lane 6: DESPACHO Y TRANSPORTE -->
  <rect x="50" y="270" width="220" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="50" y="270" width="220" height="26" rx="8" fill="#fee2e2"/>
  <text x="65" y="288" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#991b1b">6. LOGÍSTICA / ENTREGA</text>
  <text x="65" y="315" font-family="'Inter', sans-serif" font-size="11" fill="#1e293b">Programación en pizarra o cuaderno.</text>
  <text x="65" y="332" font-family="'Inter', sans-serif" font-size="11" fill="#dc2626">35.1% incidencias de calidad/daño.</text>

  <!-- Bottom Warning Banner -->
  <rect x="50" y="390" width="820" height="50" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="70" y="412" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#991b1b">CUADRO DE DOLOR (PAIN POINTS):</text>
  <text x="70" y="428" font-family="'Inter', sans-serif" font-size="11" fill="#7f1d1d">Pérdida de datos en papel &bull; Falta de visibilidad de precios y stock &bull; Sobrecostos en almacén &bull; Retrasos en atención y reclamos no rastreables.</text>
</svg>
