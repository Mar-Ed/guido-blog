<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1210" viewBox="0 0 1600 1210" role="img" aria-labelledby="alternatives-graphic-title alternatives-graphic-description" font-family="Arial, Helvetica, sans-serif"><title id="alternatives-graphic-title">Alternativas de solución para Inversiones Guido</title><desc id="alternatives-graphic-description">Comparación cualitativa de mejora local, infraestructura centralizada local y redes con servicios cloud gestionados. Recomendación preliminar sujeta a factibilidad.</desc><rect width="1600" height="1210" fill="#faf9f6"></rect><text x="48" y="42" font-size="17" letter-spacing="3" font-weight="700" fill="#475569">INVERSIONES GUIDO · INFRAESTRUCTURA TI</text><text x="48" y="94" font-size="42" font-weight="700" fill="#0f172a">Análisis de alternativas de solución</text><text x="48" y="132" font-size="22" fill="#475569">Opciones completas para conectar almacén y tienda y apoyar el registro de operaciones</text><g><rect x="48" y="176" width="480" height="724" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"></rect><text x="74" y="215" font-size="19" font-weight="700" fill="#0f766e">ALTERNATIVA 1</text><text x="74" y="258" fill="#0f172a" font-size="29" font-weight="700"><tspan x="74" dy="0">Mejora local y</tspan><tspan x="74" dy="35">estandarización</tspan></text><text x="74" y="358" fill="#334155" font-size="22" font-weight="400"><tspan x="74" dy="0">Reutilizar equipos, mejorar la red</tspan><tspan x="74" dy="29">local y ordenar los registros y</tspan><tspan x="74" dy="29">procedimientos actuales.</tspan></text><text x="74" y="505" font-size="17" font-weight="700" fill="#0f766e">ALCANCE</text><text x="74" y="538" fill="#334155" font-size="21" font-weight="400"><tspan x="74" dy="0">Adecuaciones de red, revisión de</tspan><tspan x="74" dy="28">equipos, formatos de registro y</tspan><tspan x="74" dy="28">capacitación.</tspan></text><text x="74" y="676" font-size="17" font-weight="700" fill="#92400e">CONDICIÓN A EVALUAR</text><text x="74" y="710" fill="#334155" font-size="21" font-weight="400"><tspan x="74" dy="0">La coordinación entre áreas</tspan><tspan x="74" dy="28">continúa dependiendo del</tspan><tspan x="74" dy="28">intercambio y conciliación de</tspan><tspan x="74" dy="28">archivos.</tspan></text><text x="74" y="856" font-size="18" font-weight="700" fill="#475569">Inversión y operación: por cotizar</text></g><g><rect x="560" y="176" width="480" height="724" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"></rect><text x="586" y="215" font-size="19" font-weight="700" fill="#0f766e">ALTERNATIVA 2</text><text x="586" y="258" fill="#0f172a" font-size="29" font-weight="700"><tspan x="586" dy="0">Infraestructura</tspan><tspan x="586" dy="35">centralizada local</tspan></text><text x="586" y="358" fill="#334155" font-size="22" font-weight="400"><tspan x="586" dy="0">Concentrar los recursos en un</tspan><tspan x="586" dy="29">servidor local, con red, respaldo</tspan><tspan x="586" dy="29">eléctrico y acceso entre áreas.</tspan></text><text x="586" y="505" font-size="17" font-weight="700" fill="#0f766e">ALCANCE</text><text x="586" y="538" fill="#334155" font-size="21" font-weight="400"><tspan x="586" dy="0">Servidor, switches, cableado, UPS,</tspan><tspan x="586" dy="28">copias de seguridad y conectividad</tspan><tspan x="586" dy="28">entre locales si corresponde.</tspan></text><text x="586" y="676" font-size="17" font-weight="700" fill="#92400e">CONDICIÓN A EVALUAR</text><text x="586" y="710" fill="#334155" font-size="21" font-weight="400"><tspan x="586" dy="0">Requiere mantenimiento del</tspan><tspan x="586" dy="28">servidor, protección física y</tspan><tspan x="586" dy="28">recuperación ante fallos.</tspan></text><text x="586" y="856" font-size="18" font-weight="700" fill="#475569">Inversión y operación: por cotizar</text></g><g><rect x="1072" y="176" width="480" height="724" rx="18" fill="#edf7f4" stroke="#0f766e" stroke-width="2.5"></rect><text x="1098" y="215" font-size="19" font-weight="700" fill="#0f766e">ALTERNATIVA 3</text><text x="1098" y="258" fill="#0f172a" font-size="29" font-weight="700"><tspan x="1098" dy="0">Redes y servicios cloud</tspan><tspan x="1098" dy="35">gestionados</tspan></text><text x="1098" y="358" fill="#334155" font-size="22" font-weight="400"><tspan x="1098" dy="0">Combinar red cableada y Wi-Fi</tspan><tspan x="1098" dy="29">donde se requiera con equipos</tspan><tspan x="1098" dy="29">operativos y servicios cloud</tspan><tspan x="1098" dy="29">existentes.</tspan></text><text x="1098" y="505" font-size="17" font-weight="700" fill="#0f766e">ALCANCE</text><text x="1098" y="538" fill="#334155" font-size="21" font-weight="400"><tspan x="1098" dy="0">Red, Internet, puestos de trabajo,</tspan><tspan x="1098" dy="28">UPS y contratación y configuración</tspan><tspan x="1098" dy="28">de servicios compatibles.</tspan></text><text x="1098" y="676" font-size="17" font-weight="700" fill="#92400e">CONDICIÓN A EVALUAR</text><text x="1098" y="710" fill="#334155" font-size="21" font-weight="400"><tspan x="1098" dy="0">Depende de Internet, condiciones</tspan><tspan x="1098" dy="28">del proveedor y una correcta</tspan><tspan x="1098" dy="28">gestión de accesos y datos.</tspan></text><text x="1098" y="856" font-size="18" font-weight="700" fill="#475569">Inversión y operación: por cotizar</text></g><rect x="48" y="936" width="1504" height="168" rx="18" fill="#0f172a"></rect><text x="74" y="975" font-size="18" letter-spacing="2" font-weight="700" fill="#e6c984">RECOMENDACIÓN PRELIMINAR · A3</text><text x="74" y="1014" fill="#ffffff" font-size="23" font-weight="400"><tspan x="74" dy="0">Priorizar el estudio de A3 por su correspondencia con la propuesta de redes y cloud y el acceso desde almacén</tspan><tspan x="74" dy="32">y tienda. La selección definitiva depende de cotizaciones, diagnóstico técnico, compatibilidad y capacidad de</tspan><tspan x="74" dy="32">operación.</tspan></text><text x="48" y="1155" font-size="19" fill="#475569">Alcance: adquisición, contratación, instalación y configuración de infraestructura y servicios existentes.</text><text x="48" y="1185" font-size="19" fill="#475569">Evaluación preliminar. No se presupuestan ahorros, plazos comerciales ni tarifas sin evidencia.</text></svg>
