<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510" role="img" aria-labelledby="objective-graphic-title objective-graphic-description" font-family="Arial, Helvetica, sans-serif"><title id="objective-graphic-title">Árbol de objetivos de Inversiones Guido</title><desc id="objective-graphic-description">Leer de abajo hacia arriba: medios fundamentales, medios directos, objetivo SMART y fines. Implementar, en 12 semanas desde la aprobación del proyecto, infraestructura de redes y servicios cloud que conecte almacén y tienda de Inversiones Guido y habilite el registro de inventario, ventas y comprobantes electrónicos en el 100 % de los puestos operativos definidos en el diagnóstico, con pruebas de conectividad y registro satisfactorias.</desc><rect width="1600" height="1510" fill="#faf9f6"></rect><text x="48" y="42" font-size="17" letter-spacing="3" font-weight="700" fill="#475569">INVERSIONES GUIDO · FORMULACIÓN DE PROYECTOS TI</text><text x="48" y="94" font-size="42" font-weight="700" fill="#0f172a">Árbol de objetivos</text><text x="48" y="132" font-size="21" fill="#475569">La misma estructura causal, expresada como medios, objetivo central y fines</text><g fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round"><defs><marker id="objective-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0f766e" stroke="none"></path></marker></defs><path d="M464 340 V312 H1136 V340"></path><path d="M800 312 V288" marker-end="url(#objective-arrow)"></path><path d="M800 508 V484 M464 484 H1136"></path><path d="M464 484 V462" marker-end="url(#objective-arrow)"></path><path d="M1136 484 V462" marker-end="url(#objective-arrow)"></path><path d="M800 676 V630" marker-end="url(#objective-arrow)"></path><path d="M288 932 V902 H1312 V932 M800 932 V902"></path><path d="M800 902 V876" marker-end="url(#objective-arrow)"></path><g><path d="M164 1144 V1126 H412 V1144"></path><path d="M288 1126 V1108" marker-end="url(#objective-arrow)"></path></g><g><path d="M676 1144 V1126 H924 V1144"></path><path d="M800 1126 V1108" marker-end="url(#objective-arrow)"></path></g><g><path d="M1312 1144 V1108" marker-end="url(#objective-arrow)"></path></g></g><g><rect x="240" y="166" width="1120" height="118" rx="16" fill="#ffffff" stroke="#99c8bd" stroke-width="1.5"></rect><text x="262" y="196" fill="#0f766e" font-size="18" font-weight="700">FIN FINAL</text><text x="262" y="228" fill="#1e293b" font-size="22" font-weight="400"><tspan x="262" dy="0">Contribuir a la rentabilidad y a un servicio confiable para los clientes de</tspan><tspan x="262" dy="30">Inversiones Guido.</tspan></text></g><g><rect x="164" y="340" width="600" height="118" rx="16" fill="#ffffff" stroke="#99c8bd" stroke-width="1.5"></rect><text x="186" y="370" fill="#0f766e" font-size="18" font-weight="700">FIN INDIRECTO 1.1</text><text x="186" y="402" fill="#1e293b" font-size="22" font-weight="400"><tspan x="186" dy="0">Disminuir el tiempo y el costo de</tspan><tspan x="186" dy="30">conciliación y corrección de registros.</tspan></text></g><g><rect x="836" y="340" width="600" height="118" rx="16" fill="#ffffff" stroke="#99c8bd" stroke-width="1.5"></rect><text x="858" y="370" fill="#0f766e" font-size="18" font-weight="700">FIN INDIRECTO 1.2</text><text x="858" y="402" fill="#1e293b" font-size="22" font-weight="400"><tspan x="858" dy="0">Fortalecer la confianza del cliente y</tspan><tspan x="858" dy="30">reducir el riesgo de perder ventas.</tspan></text></g><g><rect x="240" y="508" width="1120" height="118" rx="16" fill="#ffffff" stroke="#99c8bd" stroke-width="1.5"></rect><text x="262" y="538" fill="#0f766e" font-size="18" font-weight="700">FIN DIRECTO 1</text><text x="262" y="570" fill="#1e293b" font-size="22" font-weight="400"><tspan x="262" dy="0">Disponer de información oportuna y verificable para confirmar stock, preparar pedidos</tspan><tspan x="262" dy="30">y sustentar la facturación.</tspan></text></g><g><rect x="48" y="676" width="1504" height="196" rx="16" fill="#0f172a" stroke="#b89a55" stroke-width="2.5"></rect><text x="70" y="706" fill="#e6c984" font-size="18" font-weight="700">OBJETIVO CENTRAL · SMART</text><text x="70" y="738" fill="#ffffff" font-size="23" font-weight="500"><tspan x="70" dy="0">Implementar, en 12 semanas desde la aprobación del proyecto, infraestructura de redes y servicios cloud que</tspan><tspan x="70" dy="30">conecte almacén y tienda de Inversiones Guido y habilite el registro de inventario, ventas y comprobantes</tspan><tspan x="70" dy="30">electrónicos en el 100 % de los puestos operativos definidos en el diagnóstico, con pruebas de conectividad y</tspan><tspan x="70" dy="30">registro satisfactorias.</tspan></text></g><g><g><rect x="48" y="932" width="480" height="172" rx="16" fill="#ffffff" stroke="#99c8bd" stroke-width="1.5"></rect><text x="70" y="962" fill="#0f766e" font-size="18" font-weight="700">MEDIO DIRECTO 1</text><text x="70" y="994" fill="#1e293b" font-size="22" font-weight="400"><tspan x="70" dy="0">Registros de inventario y ventas</tspan><tspan x="70" dy="30">organizados y accesibles.</tspan></text></g><g><rect x="48" y="1144" width="232" height="224" rx="16" fill="#ffffff" stroke="#99c8bd" stroke-width="1.5"></rect><text x="70" y="1174" fill="#0f766e" font-size="19" font-weight="700">MEDIO 1.1</text><text x="70" y="1206" fill="#1e293b" font-size="20" font-weight="400"><tspan x="70" dy="0">Formato</tspan><tspan x="70" dy="27">unificado para</tspan><tspan x="70" dy="27">registrar</tspan><tspan x="70" dy="27">entradas,</tspan><tspan x="70" dy="27">salidas y</tspan><tspan x="70" dy="27">ventas.</tspan></text></g><g><rect x="296" y="1144" width="232" height="224" rx="16" fill="#ffffff" stroke="#99c8bd" stroke-width="1.5"></rect><text x="318" y="1174" fill="#0f766e" font-size="19" font-weight="700">MEDIO 1.2</text><text x="318" y="1206" fill="#1e293b" font-size="20" font-weight="400"><tspan x="318" dy="0">Captura y</tspan><tspan x="318" dy="27">verificación de</tspan><tspan x="318" dy="27">datos en</tspan><tspan x="318" dy="27">herramientas</tspan><tspan x="318" dy="27">existentes</tspan><tspan x="318" dy="27">configuradas.</tspan></text></g></g><g><g><rect x="560" y="932" width="480" height="172" rx="16" fill="#ffffff" stroke="#99c8bd" stroke-width="1.5"></rect><text x="582" y="962" fill="#0f766e" font-size="18" font-weight="700">MEDIO DIRECTO 2</text><text x="582" y="994" fill="#1e293b" font-size="22" font-weight="400"><tspan x="582" dy="0">Infraestructura de red y equipos</tspan><tspan x="582" dy="30">adecuados para conectar ambas</tspan><tspan x="582" dy="30">áreas.</tspan></text></g><g><rect x="560" y="1144" width="232" height="224" rx="16" fill="#ffffff" stroke="#99c8bd" stroke-width="1.5"></rect><text x="582" y="1174" fill="#0f766e" font-size="19" font-weight="700">MEDIO 2.1</text><text x="582" y="1206" fill="#1e293b" font-size="20" font-weight="400"><tspan x="582" dy="0">Puntos cableados</tspan><tspan x="582" dy="27">y cobertura</tspan><tspan x="582" dy="27">Wi-Fi</tspan><tspan x="582" dy="27">dimensionados</tspan><tspan x="582" dy="27">según puestos y</tspan><tspan x="582" dy="27">espacios.</tspan></text></g><g><rect x="808" y="1144" width="232" height="224" rx="16" fill="#ffffff" stroke="#99c8bd" stroke-width="1.5"></rect><text x="830" y="1174" fill="#0f766e" font-size="19" font-weight="700">MEDIO 2.2</text><text x="830" y="1206" fill="#1e293b" font-size="20" font-weight="400"><tspan x="830" dy="0">Internet y</tspan><tspan x="830" dy="27">servicios cloud</tspan><tspan x="830" dy="27">configurados</tspan><tspan x="830" dy="27">para el acceso</tspan><tspan x="830" dy="27">desde ambas</tspan><tspan x="830" dy="27">áreas.</tspan></text></g></g><g><g><rect x="1072" y="932" width="480" height="172" rx="16" fill="#ffffff" stroke="#99c8bd" stroke-width="1.5"></rect><text x="1094" y="962" fill="#0f766e" font-size="18" font-weight="700">MEDIO DIRECTO 3</text><text x="1094" y="994" fill="#1e293b" font-size="22" font-weight="400"><tspan x="1094" dy="0">Coordinación y control operativo</tspan><tspan x="1094" dy="30">estandarizados.</tspan></text></g><g><rect x="1072" y="1144" width="480" height="224" rx="16" fill="#ffffff" stroke="#99c8bd" stroke-width="1.5"></rect><text x="1094" y="1174" fill="#0f766e" font-size="19" font-weight="700">MEDIO 3.1</text><text x="1094" y="1206" fill="#1e293b" font-size="20" font-weight="400"><tspan x="1094" dy="0">Responsables capacitados y</tspan><tspan x="1094" dy="27">procedimientos de registro y</tspan><tspan x="1094" dy="27">conciliación definidos.</tspan></text></g></g><line x1="48" y1="1398" x2="1552" y2="1398" stroke="#d6c8a7"></line><text x="48" y="1428" fill="#475569" font-size="18" font-weight="400"><tspan x="48" dy="0">Meta de la intervención propuesta. Las 12 semanas y el 100 % de cobertura se validarán con el diagnóstico, el presupuesto y la gerencia. El</tspan><tspan x="48" dy="24">trabajo académico evalúa su factibilidad.</tspan></text></svg>
