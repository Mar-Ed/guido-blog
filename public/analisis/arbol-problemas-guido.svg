<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510" role="img" aria-labelledby="problem-graphic-title problem-graphic-description" font-family="Arial, Helvetica, sans-serif"><title id="problem-graphic-title">Árbol de problemas de Inversiones Guido</title><desc id="problem-graphic-description">Leer de abajo hacia arriba: causas indirectas, causas directas, problema central y efectos. Registro fragmentado de inventario y ventas y comunicación limitada entre el almacén y la tienda de Inversiones Guido.</desc><rect width="1600" height="1510" fill="#faf9f6"></rect><text x="48" y="42" font-size="17" letter-spacing="3" font-weight="700" fill="#475569">INVERSIONES GUIDO · FORMULACIÓN DE PROYECTOS TI</text><text x="48" y="94" font-size="42" font-weight="700" fill="#0f172a">Árbol de problemas</text><text x="48" y="132" font-size="21" fill="#475569">Registro de inventario y ventas, comunicación almacén–tienda y soporte a la facturación</text><g fill="none" stroke="#b07858" stroke-width="2.2" stroke-linejoin="round"><defs><marker id="problem-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#b07858" stroke="none"></path></marker></defs><path d="M464 340 V312 H1136 V340"></path><path d="M800 312 V288" marker-end="url(#problem-arrow)"></path><path d="M800 508 V484 M464 484 H1136"></path><path d="M464 484 V462" marker-end="url(#problem-arrow)"></path><path d="M1136 484 V462" marker-end="url(#problem-arrow)"></path><path d="M800 676 V630" marker-end="url(#problem-arrow)"></path><path d="M288 932 V902 H1312 V932 M800 932 V902"></path><path d="M800 902 V876" marker-end="url(#problem-arrow)"></path><g><path d="M164 1144 V1126 H412 V1144"></path><path d="M288 1126 V1108" marker-end="url(#problem-arrow)"></path></g><g><path d="M676 1144 V1126 H924 V1144"></path><path d="M800 1126 V1108" marker-end="url(#problem-arrow)"></path></g><g><path d="M1312 1144 V1108" marker-end="url(#problem-arrow)"></path></g></g><g><rect x="240" y="166" width="1120" height="118" rx="16" fill="#ffffff" stroke="#e3baa5" stroke-width="1.5"></rect><text x="262" y="196" fill="#9a3412" font-size="18" font-weight="700">EFECTO FINAL</text><text x="262" y="228" fill="#1e293b" font-size="22" font-weight="400"><tspan x="262" dy="0">Riesgo de menor rentabilidad y deterioro del servicio al cliente de Inversiones</tspan><tspan x="262" dy="30">Guido.</tspan></text></g><g><rect x="164" y="340" width="600" height="118" rx="16" fill="#ffffff" stroke="#e3baa5" stroke-width="1.5"></rect><text x="186" y="370" fill="#9a3412" font-size="18" font-weight="700">EFECTO INDIRECTO 1.1</text><text x="186" y="402" fill="#1e293b" font-size="22" font-weight="400"><tspan x="186" dy="0">Mayores costos y tiempo dedicados a</tspan><tspan x="186" dy="30">conciliar y corregir registros.</tspan></text></g><g><rect x="836" y="340" width="600" height="118" rx="16" fill="#ffffff" stroke="#e3baa5" stroke-width="1.5"></rect><text x="858" y="370" fill="#9a3412" font-size="18" font-weight="700">EFECTO INDIRECTO 1.2</text><text x="858" y="402" fill="#1e293b" font-size="22" font-weight="400"><tspan x="858" dy="0">Riesgo de ventas perdidas y menor confianza</tspan><tspan x="858" dy="30">del cliente.</tspan></text></g><g><rect x="240" y="508" width="1120" height="118" rx="16" fill="#ffffff" stroke="#e3baa5" stroke-width="1.5"></rect><text x="262" y="538" fill="#9a3412" font-size="18" font-weight="700">EFECTO DIRECTO 1</text><text x="262" y="570" fill="#1e293b" font-size="22" font-weight="400"><tspan x="262" dy="0">Demoras y errores al confirmar stock, preparar pedidos y sustentar la facturación.</tspan></text></g><g><rect x="48" y="676" width="1504" height="196" rx="16" fill="#0f172a" stroke="#b89a55" stroke-width="2.5"></rect><text x="70" y="706" fill="#e6c984" font-size="18" font-weight="700">PROBLEMA CENTRAL</text><text x="70" y="738" fill="#ffffff" font-size="23" font-weight="500"><tspan x="70" dy="0">Registro fragmentado de inventario y ventas y comunicación limitada entre el almacén y la tienda de Inversiones</tspan><tspan x="70" dy="30">Guido.</tspan></text></g><g><g><rect x="48" y="932" width="480" height="172" rx="16" fill="#ffffff" stroke="#e3baa5" stroke-width="1.5"></rect><text x="70" y="962" fill="#9a3412" font-size="18" font-weight="700">CAUSA DIRECTA 1</text><text x="70" y="994" fill="#1e293b" font-size="22" font-weight="400"><tspan x="70" dy="0">Registros manuales y dispersos de</tspan><tspan x="70" dy="30">inventario y ventas.</tspan></text></g><g><rect x="48" y="1144" width="232" height="224" rx="16" fill="#ffffff" stroke="#e3baa5" stroke-width="1.5"></rect><text x="70" y="1174" fill="#9a3412" font-size="19" font-weight="700">CAUSA 1.1</text><text x="70" y="1206" fill="#1e293b" font-size="20" font-weight="400"><tspan x="70" dy="0">Entradas,</tspan><tspan x="70" dy="27">salidas y ventas</tspan><tspan x="70" dy="27">registradas en</tspan><tspan x="70" dy="27">papel y archivos</tspan><tspan x="70" dy="27">separados.</tspan></text></g><g><rect x="296" y="1144" width="232" height="224" rx="16" fill="#ffffff" stroke="#e3baa5" stroke-width="1.5"></rect><text x="318" y="1174" fill="#9a3412" font-size="19" font-weight="700">CAUSA 1.2</text><text x="318" y="1206" fill="#1e293b" font-size="20" font-weight="400"><tspan x="318" dy="0">Digitación</tspan><tspan x="318" dy="27">repetida entre</tspan><tspan x="318" dy="27">apuntes y hojas</tspan><tspan x="318" dy="27">de cálculo.</tspan></text></g></g><g><g><rect x="560" y="932" width="480" height="172" rx="16" fill="#ffffff" stroke="#e3baa5" stroke-width="1.5"></rect><text x="582" y="962" fill="#9a3412" font-size="18" font-weight="700">CAUSA DIRECTA 2</text><text x="582" y="994" fill="#1e293b" font-size="22" font-weight="400"><tspan x="582" dy="0">Conectividad y equipamiento</tspan><tspan x="582" dy="30">insuficientes para una operación</tspan><tspan x="582" dy="30">integrada.</tspan></text><text x="582" y="1088" fill="#92400e" font-size="16" font-weight="600">Por validar en visita técnica</text></g><g><rect x="560" y="1144" width="232" height="224" rx="16" fill="#ffffff" stroke="#e3baa5" stroke-width="1.5"></rect><text x="582" y="1174" fill="#9a3412" font-size="19" font-weight="700">CAUSA 2.1</text><text x="582" y="1206" fill="#1e293b" font-size="20" font-weight="400"><tspan x="582" dy="0">Puntos de</tspan><tspan x="582" dy="27">conexión y</tspan><tspan x="582" dy="27">cobertura sin</tspan><tspan x="582" dy="27">dimensionar para</tspan><tspan x="582" dy="27">los puestos</tspan><tspan x="582" dy="27">requeridos.</tspan></text></g><g><rect x="808" y="1144" width="232" height="224" rx="16" fill="#ffffff" stroke="#e3baa5" stroke-width="1.5"></rect><text x="830" y="1174" fill="#9a3412" font-size="19" font-weight="700">CAUSA 2.2</text><text x="830" y="1206" fill="#1e293b" font-size="20" font-weight="400"><tspan x="830" dy="0">Capacidad de</tspan><tspan x="830" dy="27">Internet y</tspan><tspan x="830" dy="27">enlace entre</tspan><tspan x="830" dy="27">áreas pendientes</tspan><tspan x="830" dy="27">de diagnóstico</tspan><tspan x="830" dy="27">técnico.</tspan></text></g></g><g><g><rect x="1072" y="932" width="480" height="172" rx="16" fill="#ffffff" stroke="#e3baa5" stroke-width="1.5"></rect><text x="1094" y="962" fill="#9a3412" font-size="18" font-weight="700">CAUSA DIRECTA 3</text><text x="1094" y="994" fill="#1e293b" font-size="22" font-weight="400"><tspan x="1094" dy="0">Coordinación y control operativo</tspan><tspan x="1094" dy="30">poco estandarizados.</tspan></text><text x="1094" y="1088" fill="#92400e" font-size="16" font-weight="600">Por validar con responsables</text></g><g><rect x="1072" y="1144" width="480" height="224" rx="16" fill="#ffffff" stroke="#e3baa5" stroke-width="1.5"></rect><text x="1094" y="1174" fill="#9a3412" font-size="19" font-weight="700">CAUSA 3.1</text><text x="1094" y="1206" fill="#1e293b" font-size="20" font-weight="400"><tspan x="1094" dy="0">Procedimientos, responsables y</tspan><tspan x="1094" dy="27">capacitación para el registro aún por</tspan><tspan x="1094" dy="27">estandarizar.</tspan></text></g></g><line x1="48" y1="1398" x2="1552" y2="1398" stroke="#d6c8a7"></line><text x="48" y="1428" fill="#475569" font-size="18" font-weight="400"><tspan x="48" dy="0">Síntesis del diagnóstico del blog. Las causas de conectividad, equipamiento y procedimientos requieren validación; los efectos son riesgos</tspan><tspan x="48" dy="24">analizados, no pérdidas cuantificadas.</tspan></text></svg>
